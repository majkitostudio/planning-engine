name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Lint, testy, validace schématu ani build nepotřebují běžící databázi.
  # Adresa je jen syntakticky platná, aby Prisma CLI prošlo validací.
  DATABASE_URL: postgresql://planning:planning@localhost:5432/planning?schema=public

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testy
        run: npm run test

      - name: Validace Prisma schématu
        run: npm run db:validate

      - name: Build
        run: npm run build

  monthly-solver:
    name: Synthetic monthly solver checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scripts/requirements-monthly-solver.txt

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -r scripts/requirements-monthly-solver.txt
          npm ci

      - name: Test CP-SAT model
        run: python -m unittest discover -s scripts -p monthly_solver_test.py -v

      - name: Test solver HTTP boundary
        run: python -m unittest discover -s scripts -p monthly_solver_http_test.py -v

      - name: Cross-check independent validator
        run: npx tsx scripts/verify-monthly-solver.ts

  database-integration:
    name: Database integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: planning_monthly_test
          POSTGRES_USER: planning
          POSTGRES_PASSWORD: planning
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U planning -d planning_monthly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://planning:planning@localhost:55439/planning_monthly_test?schema=public
      PLANNING_AUTH_SESSION_INTEGRATION: "1"
      PLANNING_CONFIRMATION_RACE_INTEGRATION: "1"
      PLANNING_PERSISTENCE_INTEGRATION: "1"
      PLANNING_MONTHLY_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Aplikace databázových migrací
        run: npx prisma migrate deploy

      - name: Databázové integrační testy
        run: >-
          npx vitest run
          lib/auth/account-session.integration.test.ts
          lib/planning/confirmation-race.integration.test.ts
          lib/planning/persistence-prisma.integration.test.ts
          lib/planning/monthly-prisma.integration.test.ts
